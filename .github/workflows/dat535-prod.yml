name: DAT535 — Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: Run the H&M medallion pipeline
        required: true
        default: hm
        type: choice
        options: [hm]

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: self-hosted
    environment: main
    env:
      DAT535_ENV: prod
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
      HM_DATASET_DIR: ${{ vars.HM_DATASET_DIR || '/home/ubuntu/HMDataSet' }}
      SPARK_MASTER_URL: ${{ vars.SPARK_MASTER_URL || 'local[2]' }}
      SPARK_DRIVER_MEMORY: ${{ vars.SPARK_DRIVER_MEMORY || '3g' }}
      SPARK_EXECUTOR_MEMORY: ${{ vars.SPARK_EXECUTOR_MEMORY || '3g' }}
      SPARK_SHUFFLE_PARTITIONS: ${{ vars.SPARK_SHUFFLE_PARTITIONS || '200' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve output directory
        id: output-dir
        # Persistent, non-tmp path: survives runner reboots/tmpfiles cleanup, unlike /tmp
        run: echo "dir=$HOME/spark-lab-data/prod" >> "$GITHUB_OUTPUT"

      - name: Run Production Pipeline
        env:
          DAT535_OUTPUT_DIR: ${{ steps.output-dir.outputs.dir }}
        run: |
          source ~/spark-env/bin/activate
          test -d "$HM_DATASET_DIR" || { echo "::error::Dataset directory does not exist: $HM_DATASET_DIR"; exit 1; }
          test -f "$HM_DATASET_DIR/transactions_train.parquet" -o -f "$HM_DATASET_DIR/transactions_train.csv" || { echo "::error::transactions_train source is missing"; exit 1; }
          mkdir -p "$DAT535_OUTPUT_DIR"
          python -m py_compile hm_medallion_pipeline.py run_pipeline.py
          python "$GITHUB_WORKSPACE/run_pipeline.py" hm \
            --input-dir "$HM_DATASET_DIR" \
            --output-dir "$DAT535_OUTPUT_DIR" \
            --batch-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --master "$SPARK_MASTER_URL"

      - name: Upload Production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prod-outputs-${{ github.run_number }}
          path: ${{ steps.output-dir.outputs.dir }}/
          retention-days: 30
          if-no-files-found: ignore

      - name: Write pipeline summary
        run: |
          echo "## Production Pipeline Run" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline | H&M medallion |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          cat "${{ steps.output-dir.outputs.dir }}/quality/github-${{ github.run_id }}-${{ github.run_attempt }}.json" >> "$GITHUB_STEP_SUMMARY"